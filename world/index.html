<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FIZZ MAP CHAT</title>
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='none' stroke='%23fff' stroke-width='2'/><circle cx='50' cy='50' r='15' fill='%23fff'/></svg>" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:#fff;font-family:'Courier New',ui-monospace,Consolas,Menlo,monospace;overflow:hidden}
  #app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column}
  header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:linear-gradient(180deg,rgba(0,0,0,0.95),transparent);border-bottom:1px solid rgba(255,255,255,0.08)}
  .brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.15em;text-transform:uppercase}
  .brand-mark{width:18px;height:18px;border:1px solid #fff;border-radius:50%;position:relative}
  .brand-mark::after{content:'';position:absolute;top:50%;left:50%;width:6px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
  nav{display:flex;gap:24px}
  nav a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
  nav a:hover{color:#fff}

  #globe{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1}
  canvas#globe-canvas{display:block;width:100%;height:100%}

  .controls{position:fixed;bottom:80px;left:24px;z-index:20;display:flex;flex-direction:column;gap:8px}
  .ctrl-btn{width:40px;height:40px;background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
  .ctrl-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.4)}
  .ctrl-btn:focus{outline:none;border-color:#fff}

  .status-bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(0,0,0,0.9);border-top:1px solid rgba(255,255,255,0.08);padding:8px 24px;font-size:11px;letter-spacing:.1em;display:flex;flex-wrap:wrap;gap:24px;align-items:center;font-family:'Cascadia Code','JetBrains Mono','Fira Code',ui-monospace,Consolas,Menlo,monospace}
  .status-item{display:flex;align-items:center;gap:8px}
  .status-label{color:rgba(255,255,255,0.5);text-transform:uppercase}
  .status-value{color:#fff;font-variant-numeric:tabular-nums}
  .status-sep{color:rgba(255,255,255,0.15)}

  .panel{position:fixed;top:60px;right:0;bottom:80px;width:360px;max-width:100vw;z-index:30;background:rgba(0,0,0,0.95);border-left:1px solid rgba(255,255,255,0.08);transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;overflow:hidden}
  .panel.open{transform:translateX(0)}
  .panel-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center}
  .panel-title{font-size:12px;letter-spacing:.15em;text-transform:uppercase}
  .panel-close{background:none;border:none;color:rgba(255,255,255,0.5);font:inherit;cursor:pointer;padding:4px}
  .panel-close:hover{color:#fff}
  .panel-content{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
  .cell-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:12px}
  .cell-meta .label{color:rgba(255,255,255,0.5);text-transform:uppercase}
  .cell-meta .value{color:#fff;font-family:'Cascadia Code','JetBrains Mono','Fira Code',ui-monospace,Consolas,Menlo,monospace}
  .color-swatch{width:20px;height:20px;border:1px solid rgba(255,255,255,0.2);display:inline-block}
  .divider{height:1px;background:rgba(255,255,255,0.08)}
  .messages{display:flex;flex-direction:column;gap:12px;max-height:200px;overflow-y:auto}
  .msg{padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
  .msg-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
  .msg-author{color:#fff}
  .msg-time{color:rgba(255,255,255,0.4)}
  .msg-text{font-size:13px;line-height:1.5;white-space:pre-wrap}
  .section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px}
  .panel-empty{color:rgba(255,255,255,0.4);font-size:12px;text-align:center;padding:18px 0}
  .panel-note{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);font-size:12px;color:rgba(255,255,255,0.65);line-height:1.4}
  .inline-btn{background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:7px 12px;font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .inline-btn:hover{background:rgba(255,255,255,0.12);border-color:#fff}
  .note-time{color:rgba(255,255,255,0.35);font-family:'Cascadia Code','JetBrains Mono','Fira Code',ui-monospace,Consolas,Menlo,monospace;font-size:11px;white-space:nowrap}

  .contribute-form{display:flex;flex-direction:column;gap:12px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08)}
  .form-row{display:flex;flex-direction:column;gap:6px}
  .form-label{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.1em}
  .form-input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:10px 12px;font:inherit;font-size:13px}
  .form-input:focus{outline:none;border-color:#fff;background:rgba(255,255,255,0.06)}
  .form-input::placeholder{color:rgba(255,255,255,0.3)}
  .form-hint{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.4}
  .char-count{font-size:11px;color:rgba(255,255,255,0.4);text-align:right;font-variant-numeric:tabular-nums}
  .color-picker{display:flex;gap:8px;flex-wrap:wrap}
  .color-option{width:28px;height:28px;border:2px solid transparent;border-radius:4px;cursor:pointer;transition:transform .1s,border-color .1s}
  .color-option:hover{transform:scale(1.1)}
  .color-option.selected{border-color:#fff;transform:scale(1.1)}
  .submit-btn{background:#fff;color:#000;border:none;padding:10px;font:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s}
  .submit-btn:hover{background:rgba(255,255,255,0.8)}
  .submit-btn:disabled{opacity:0.4;cursor:not-allowed}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);opacity:0;background:rgba(0,0,0,0.95);border:1px solid rgba(255,255,255,0.2);padding:12px 24px;font-size:12px;letter-spacing:.05em;z-index:60;transition:transform .3s,opacity .3s}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.error{border-color:#f66;color:#f66}

  .view{display:none;position:fixed;top:60px;left:0;right:0;bottom:80px;z-index:15;background:#000;overflow-y:auto;padding:24px}
  .view.active{display:block}
  .view-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.08)}
  .view-title{font-size:14px;letter-spacing:.15em;text-transform:uppercase}
  .view-subtitle{font-size:12px;color:rgba(255,255,255,0.5);margin-top:4px}
  .activity-list{display:flex;flex-direction:column;gap:8px}
  .activity-item{display:flex;gap:16px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:background .2s}
  .activity-item:hover{background:rgba(255,255,255,0.06)}
  .activity-color{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .activity-info{flex:1;min-width:0}
  .activity-author{font-size:12px;color:#fff}
  .activity-preview{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .activity-meta{font-size:11px;color:rgba(255,255,255,0.4);font-family:'Cascadia Code','JetBrains Mono','Fira Code',ui-monospace,Consolas,Menlo,monospace;white-space:nowrap}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:20px}
  .stat-value{font-size:32px;font-weight:bold;font-variant-numeric:tabular-nums;line-height:1}
  .stat-label{font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}
  .chart{height:200px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);position:relative}
  .chart-canvas{width:100%;height:100%}
  .leaderboard{display:flex;flex-direction:column;gap:8px}
  .leader-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
  .leader-rank{font-size:24px;color:rgba(255,255,255,0.2);font-variant-numeric:tabular-nums;width:40px;text-align:right}
  .leader-color{width:10px;height:10px;border-radius:50%}
  .leader-name{flex:1;font-size:13px}
  .leader-count{font-size:13px;color:rgba(255,255,255,0.6);font-variant-numeric:tabular-nums}


  @media (max-width: 768px){
    header{padding:10px 16px}
    nav{gap:16px}
    .controls{bottom:100px;left:12px}
    .status-bar{padding:8px 16px;gap:16px;font-size:10px}
    .panel{width:100%;top:56px;bottom:100px}
    .view{padding:16px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <span>FIZZ MAP CHAT</span>
    </div>
    <div style="display:flex;align-items:center;gap:20px">
      <nav id="nav-main">
        <a href="#" data-view="globe">Explore</a>
        <a href="#" data-view="activity">Activity</a>
        <a href="#" data-view="stats">Statistics</a>
      </nav>
    </div>
  </header>

  <div id="globe">
    <canvas id="globe-canvas"></canvas>
  </div>

  <div class="controls" aria-label="Map controls">
    <button class="ctrl-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
    <button class="ctrl-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
    <button class="ctrl-btn" id="reset-view" aria-label="Reset view" title="Reset view">⌂</button>
    <button class="ctrl-btn" id="toggle-projection" aria-label="Toggle projection" title="Toggle projection">◐</button>
    <button class="ctrl-btn" id="locate-activity" aria-label="Locate recent activity" title="Recent activity">⌖</button>
  </div>

  <div class="status-bar" role="status" aria-live="polite">
    <span class="status-sep" aria-hidden="true">│</span>
    <span class="status-item"><span class="status-label">WORLD STATUS:</span><span class="status-value" id="status-world">LIVE</span></span>
    <span class="status-sep" aria-hidden="true">│</span>
    <span class="status-item"><span class="status-label">CONTRIBUTIONS:</span><span class="status-value" id="status-contributions">—</span></span>
    <span class="status-sep" aria-hidden="true">│</span>
    <span class="status-item"><span class="status-label">ACTIVE USERS:</span><span class="status-value" id="status-users">—</span></span>
    <span class="status-sep" aria-hidden="true">│</span>
    <span class="status-item"><span class="status-label">CELLS CLAIMED:</span><span class="status-value" id="status-cells">—</span></span>
  </div>

  <aside class="panel" id="panel" role="complementary" aria-label="Cell details">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">CELL DETAILS</span>
      <button class="panel-close" id="panel-close" aria-label="Close panel">×</button>
    </div>
    <div class="panel-content" id="panel-content"></div>
  </aside>

  <section class="view" id="view-activity" role="region" aria-label="Activity feed">
    <div class="view-header">
      <h2 class="view-title">Activity Feed</h2>
      <p class="view-subtitle">Real-time contributions from around the world</p>
    </div>
    <div class="activity-list" id="activity-list"></div>
  </section>

  <section class="view" id="view-stats" role="region" aria-label="Statistics">
    <div class="view-header">
      <h2 class="view-title">Statistics</h2>
      <p class="view-subtitle">Global contribution metrics</p>
    </div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="chart"><canvas class="chart-canvas" id="history-chart"></canvas></div>
    <div style="margin-top:24px">
      <h3 style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:12px">Top Contributors</h3>
      <div class="leaderboard" id="leaderboard"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>
</div>

<script type="module">
console.log('[init] module script starting');
import { Globe } from './globe.js?v=71';
import { UI } from './ui.js?v=56';
console.log('[init] imports loaded');

const ui = new UI();
const globe = new Globe(document.getElementById('globe-canvas'), ui);
console.log('[init] globe created');

try {
  console.log('[init] calling globe.init()...');
  await globe.init();
  console.log('[init] globe initialized');
} catch (e) {
  console.error('[init] globe.init() failed:', e);
  throw e;
}

ui.init(globe);

globalThis.__APP__ = { globe, ui };
console.log('[init] done');
</script>
</body>
</html>
